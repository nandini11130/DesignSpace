  <text x="130" y="404" fill="#94A3B8" font-size="26" font-family="Segoe UI, Arial, sans-serif">A shared workspace for product teams to brainstorm, sketch, review,</text>
  <text x="130" y="444" fill="#94A3B8" font-size="26" font-family="Segoe UI, Arial, sans-serif">and iterate on ideas with live collaboration.</text>
